syntax = "proto3";

package chat;

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc JoinChat(JoinRequest) returns (JoinResponse);
  rpc SendMessage(ChatMessage) returns (Empty);
  rpc StreamMessages(Empty) returns (stream ChatEvent);
}

message JoinRequest {
  string user_name = 1;
}

message JoinResponse {
  bool success = 1;
  string message = 2;
}

message ChatMessage {
  string user = 1;
  string text = 2;
  string room = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message ChatEvent {
  oneof event {
    ChatMessage message = 1;
    UserEvent user_event = 2;
    ServerNotice notice = 3;
  }
}

message UserEvent {
  enum Action {
    JOINED = 0;
    LEFT = 1;
  }
  Action action = 1;
  string user_name = 2;
}

message ServerNotice {
  string text = 1;
}

message Empty {}
