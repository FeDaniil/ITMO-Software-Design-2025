name: build_sphinx_docs

on:
  push:
    branches:
      - master
      - hw-2

jobs:
  build_docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: snok/install-poetry@v1
      with:
        version: 2.2.1
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies using poetry
      run: poetry install --no-interaction --no-root

    - name: Remove all .rst files except index.rst
      run: |
        find docs/source -type f -name "*.rst" ! -name "index.rst" -exec rm -f {} \;

    - name: Generate .rst files from package
      run: |
        poetry run sphinx-apidoc -o docs/source src/sd_cli/

    - name: Build Sphinx HTML documentation
      run: |
        cd docs
        poetry run sphinx-build -b html source build/html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: sphinx-html
        path: docs/build/html

    # Publish built docs to gh-pages branch
    # ===============================
    - name: Commit documentation changes
      run: |
        git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/FeDaniil/ITMO-Software-Design-2025.git --branch gh-pages --single-branch gh-pages
        cd gh-pages
        git clean -fdx  # Remove old untracked files and directories
        cp -r ../docs/build/html/* .  # Copy new HTML files to gh-pages
        touch .nojekyll
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update documentation" -a || true
        # The above command will fail if no changes were present, so we ignore
        # that.
      env:
        GH_PAT: ${{ secrets.GITHUB_TOKEN }}

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        branch: gh-pages
        directory: gh-pages
        GH_PAT: ${{ secrets.GITHUB_TOKEN }}
    # ===============================